      <path d="M0,0 L10,0 L0,10 Z" fill="#6B2430" />
      <path d="M0,0 L0,-10 L10,0 Z" fill="#8C6B3E" />
      <path d="M0,0 L-10,0 L0,-10 Z" fill="#6B2430" />
      <path d="M0,0 L0,10 L-10,0 Z" fill="#8C6B3E" />
    </g>
  </defs>
  <rect width="40" height="40" fill="#F4F1EC" />
